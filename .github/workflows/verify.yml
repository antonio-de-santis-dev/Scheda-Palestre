name: Verify

on:
  pull_request:
    branches: [delpy]
  push:
    branches: [desaig, fixV2, veloce, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit, architecture and PostgreSQL integration tests
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: CiPassword2026
      GYM_ADMIN_USERNAME: ci-admin
      GYM_ADMIN_EMAIL: ci-admin@example.test
      GYM_ADMIN_PASSWORD: CiPassword2026
      GYM_DOMAIN: gym.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        run: docker compose --profile app config --quiet
      - name: Validate production Compose
        run: docker compose -f compose.production.yaml config --quiet

      - name: Build production frontend image
        run: docker build -t gym-frontend-ci frontend
      - name: Verify production Nginx responses and compression
        run: |
          docker run -d --name gym-frontend-ci --add-host gym-planner-backend:127.0.0.1 -p 127.0.0.1:18080:80 gym-frontend-ci
          python3 scripts/check-frontend-container.py
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs gym-frontend-ci || true
          docker rm -f gym-frontend-ci || true
