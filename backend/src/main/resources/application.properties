spring.application.name=gym-planner

# --- Database (values from environment, see .env.example) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymplanner}
spring.datasource.username=${DB_USERNAME:gymplanner}
spring.datasource.password=${DB_PASSWORD:}

# Flyway is the only owner of the schema: Hibernate only validates the mapping.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.order_updates=true

# --- HTTP session & cookies (spec 11) ---
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=GYMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${GYM_COOKIE_SECURE:false}
server.forward-headers-strategy=framework

# --- Errors: never leak internals ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Actuator: health only, without details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# --- Application ---
gymplanner.admin.username=${GYM_ADMIN_USERNAME:}
gymplanner.admin.email=${GYM_ADMIN_EMAIL:}
gymplanner.admin.password=${GYM_ADMIN_PASSWORD:}
gymplanner.security.max-failed-logins=5
gymplanner.security.lock-duration=15m
gymplanner.security.cors-allowed-origins=${GYM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
gymplanner.time-zone=${GYM_TIME_ZONE:Europe/Rome}

# --- Logging (no sensitive data is ever logged) ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
