# Protocollo esterno comunicato dal proxy HTTPS.
map $http_x_forwarded_proto $gym_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Real client address: X-Forwarded-For is trusted only from the private Docker networks (Caddy
# in production), so the login limit below counts browsers, not the reverse proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# Password spraying protection, on top of the per-account lock of the backend.
limit_req_zone $binary_remote_addr zone=gym_login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 256k;
    include /etc/nginx/snippets/gym-security-headers.conf;

    # Compress public static assets; authenticated API responses are excluded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    # Keep the port of the original Host: the backend compares it with the browser's
    # Origin header to recognise same-origin requests (CORS/CSRF). Inherited by the API locations.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gym_forwarded_proto;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Port "";

    location /api/ {
        proxy_pass http://gym-planner-backend:8080;
    }

    location = /api/auth/login {
        limit_req zone=gym_login burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass http://gym-planner-backend:8080;
    }

    # Same Problem Details shape as the backend, so the SPA shows its Italian message.
    location @login_rate_limited {
        include /etc/nginx/snippets/gym-security-headers.conf;
        add_header Retry-After 60 always;
        default_type application/problem+json;
        return 429 '{"type":"https://gymplanner/errors/rate-limited","title":"Too Many Requests","status":429,"detail":"Too many login attempts, retry later","code":"RATE_LIMITED"}';
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/gym-security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Installation metadata must be JSON, and missing icon assets must not return the SPA HTML.
    location = /manifest.webmanifest {
        expires -1;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /icons/ {
        expires -1;
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are resolved by React Router.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
