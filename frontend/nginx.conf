# Protocollo esterno comunicato dal proxy HTTPS.
map $http_x_forwarded_proto $gym_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 256k;
    include /etc/nginx/snippets/gym-security-headers.conf;

    # Compress public static assets; authenticated API responses are excluded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://gym-planner-backend:8080;
        # Keep the port of the original Host: the backend compares it with the browser's
        # Origin header to recognise same-origin requests (CORS/CSRF).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gym_forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/gym-security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Installation metadata must be JSON, and missing icon assets must not return the SPA HTML.
    location = /manifest.webmanifest {
        expires -1;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /icons/ {
        expires -1;
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are resolved by React Router.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
